name: Job Monitor

on:
  schedule:
    # 周一/三/五 北京时间16:00 = UTC 08:00
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch:    # 手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run job monitor
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
        run: python3 scripts/job_monitor.py

      - name: Commit updated seen_jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          if git diff --cached --quiet; then
            echo "No changes to seen_jobs.json"
          else
            git commit -m "chore: update seen_jobs [skip ci]"
            git push
          fi
